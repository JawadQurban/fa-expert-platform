name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend · typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test (with coverage)
        run: npm run coverage

      - name: Token pipeline validation
        run: npm run tokens:validate

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  backend:
    name: Backend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Warnings are errors (Directory.Build.props), so this is the analyzer gate too.
      # The test suite runs against SQL Server LocalDB, which is Windows-only:
      # `dotnet test` stays a required local step until the tests take a
      # containerised SQL Server.
      - name: Build
        run: dotnet build
