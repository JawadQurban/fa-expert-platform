# Expert Hub — CONTAINER Nginx server block (installed at
# /etc/nginx/conf.d/default.conf). Serves the static Expert Hub SPA under the
# base path, with SPA fallback, tiered caching, security headers, and a health
# endpoint. TLS + public routing are handled by the EXTERNAL server Nginx
# (see server-nginx.example.conf) — this container speaks plain HTTP on :8080.
#
# The frontend container NEVER proxies FAST / MTM / ERP / SQL Server. The future
# backend is reached via the Expert Hub API base URL (runtime config.js).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Never expose the container's Nginx version.
    server_tokens off;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── Security headers (server-level default) ──────────────────────────────
    # add_header does not inherit into locations that set their own headers, so
    # the document/asset locations re-declare the ones they need.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    # Note: HSTS/CSP are best set at the TLS-terminating external Nginx.

    # ── Health check (base-path independent) ────────────────────────────────
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Redirect the bare prefix to the trailing-slash app root ──────────────
    location = /expert-hub {
        return 301 /expert-hub/;
    }

    # ── Hashed, immutable static assets — long cache; missing ⇒ 404 (not SPA).
    #    `^~` so this wins over the "missing file" regex below for asset paths.
    location ^~ /expert-hub/assets/ {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Runtime config — must never be cached (regenerated per environment) ───
    location = /expert-hub/config.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    # ── App shell — always revalidate so new deploys are picked up ────────────
    location = /expert-hub/index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # ── Missing physical file WITH an extension ⇒ real 404 (never the SPA doc).
    #    Extensionless app routes skip this and fall through to the SPA fallback.
    location ~ ^/expert-hub/.+\.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # ── SPA routes — real files/dirs win; unknown app routes serve the shell ──
    location /expert-hub/ {
        try_files $uri $uri/ /expert-hub/index.html;
    }

    # Root is owned by the external Nginx / other products — nothing here.
    location = / {
        return 404;
    }
}
