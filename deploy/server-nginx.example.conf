# Expert Hub — EXAMPLE external (server) Nginx reverse proxy.
#
# This is an EXAMPLE. Merge these blocks into your EXISTING server{} on the host.
# It routes ONLY `/expert-hub/` to the Expert Hub container and must NOT change
# the default `/` route or any other product's location (Hackathon, etc.).
#
# After editing the real config, validate and reload (never restart destructively):
#   sudo nginx -t
#   sudo systemctl reload nginx

# Place ONCE in the http{} context (needed for WebSocket upgrade forwarding):
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

# Upstream = the container's localhost-bound port (EXPERT_HUB_HOST_PORT).
upstream expert_hub_frontend {
    server 127.0.0.1:8085;
    keepalive 16;
}

server {
    # ... your EXISTING server context (listen 443 ssl; server_name …; TLS certs;
    #     the default `/` location and any other products) stays UNCHANGED ...

    # ── Expert Hub frontend ──────────────────────────────────────────────────
    # Keep the `/expert-hub/` prefix end-to-end: the container serves under it,
    # so proxy_pass has NO trailing path (the original URI is preserved).
    location /expert-hub/ {
        proxy_pass http://expert_hub_frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade compatibility (future live features).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
    }

    # Redirect the bare prefix to the app root (the container also handles this).
    location = /expert-hub {
        return 301 /expert-hub/;
    }

    # ── Expert Hub API (ASP.NET Core) — the /api mount, P-166 ────────────────
    # No prefix strip: the app maps /api/... internally, so the path passes
    # through as-is. The X-Forwarded headers are REQUIRED — the API builds the
    # OIDC redirect URI and the cookie Secure flag from them.
    # ⚠️ REQUIRED alongside the API. A session cookie can outgrow nginx's
    # request-header buffers (4 × 8k by default) and the answer is a flat
    # `400 Request Header Or Cookie Too Large` from nginx, before the API sees
    # anything — seen on the testing server 2026-09-06. The platform now keeps
    # the ticket server-side so the cookie is one GUID, but this stays as the
    # floor: other cookies on the same host count toward the same limit.
    large_client_header_buffers 8 32k;

    location /api/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        # ⚠️ REQUIRED for attachment uploads. nginx's default body limit is
        # 1 MB, and an upload of a 1 MB document is a multipart body slightly
        # LARGER than the file — so the default rejects the very size the
        # attachment rules allow, with a 413 the API never sees. Keep this
        # comfortably above the largest `ATTACHMENT_RULE.max_size_mb`.
        client_max_body_size 25m;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        # The sign-in response carries large Set-Cookie headers (the encrypted
        # session ticket is chunked) — nginx's 4k defaults 502 on the SSO
        # callback without these:
        proxy_buffer_size        16k;
        proxy_buffers            8 16k;
        proxy_busy_buffers_size  32k;
    }

    # DO NOT add or modify `location /` or other product locations here.
}
