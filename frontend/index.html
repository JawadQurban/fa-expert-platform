<!doctype html>
<!--
  Expert Hub — the document shell (Arabic-first, RTL-default). Built by
  `vite.config.ts` (base = VITE_EXPERT_HUB_BASE_PATH); mounts src/main.tsx.
  `config.js` (runtime configuration) loads first, before the app bundle, and is
  regenerated from env when the container starts.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="منصة الخبراء والمدربين — إدارة اعتماد الخبراء والمدربين المستقلين في الأكاديمية المالية."
    />
    <title>منصة الخبراء والمدربين</title>
    <!-- Runtime configuration — MUST load before the app bundle. Regenerated from
         environment variables at container start (see deploy). -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
